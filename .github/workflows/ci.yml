name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/report/package-lock.json }
      - run: npm ci --prefix web/report
      - run: go test ./...
      - run: go vet ./...
      - run: npm --prefix web/report test
      - run: npm --prefix web/report run build
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - run: go test ./... -run 'Privacy|Contract|Determinism|Migration|Benchmark'
